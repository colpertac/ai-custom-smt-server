# Minimal COMP updater HTTP (overlay-first /files/), replaces serve-updater-local.py in Docker.
# Mount repo updater/ at /var/www/updater (site, overlay, base).

server {
    listen 80;
    server_name _;

    root /var/www/updater/site;

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        add_header Cache-Control "must-revalidate, private, no-cache, no-store" always;
    }

    location ~ \.(php|pl|py|sh|fcgi)$ {
        return 403;
    }

    # Overlay first, then base (same as serve-updater-local.py).
    location ~* ^/files/(.+)$ {
        root /var/www/updater;
        try_files /overlay/$1 /base/$1 =404;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        add_header Cache-Control "must-revalidate, private, no-cache, no-store" always;
    }
}
