<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5" />
    <title>Maintenance — SMT</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --fg: #e8eaed;
        --muted: #9aa3af;
        --accent: #c4a574;
        --line: #2a313c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(1200px 600px at 50% -10%, #1a2330 0%, transparent 60%),
          var(--bg);
        color: var(--fg);
        padding: 2rem;
      }
      main {
        width: min(36rem, 100%);
        border-top: 1px solid var(--line);
        padding-top: 1.5rem;
      }
      .brand {
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.75rem;
        color: var(--accent);
        margin: 0 0 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 600;
        line-height: 1.2;
      }
      p {
        margin: 0 0 0.75rem;
        color: var(--muted);
        line-height: 1.55;
      }
      #status {
        margin-top: 1.25rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--line);
        border-radius: 0.35rem;
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 0.85rem;
        color: var(--fg);
        white-space: pre-wrap;
        min-height: 2.5rem;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">SMT</p>
      <h1>Website undergoing maintenance</h1>
      <p>
        The site is temporarily unavailable while the server stack is updating
        or restarting. This page refreshes every few seconds.
      </p>
      <div id="status">Checking update status…</div>
      <p class="hint">Game client updater files under /files/ stay available when possible.</p>
    </main>
    <script>
      async function tick() {
        const el = document.getElementById("status")
        try {
          const res = await fetch("/.maintenance-status?ts=" + Date.now(), {
            cache: "no-store",
          })
          if (res.ok) {
            const text = (await res.text()).trim()
            el.textContent = text || "Update in progress…"
            return
          }
        } catch (_) {
          /* upstream still bouncing */
        }
        el.textContent =
          "Waiting for the website to come back… (auto-refresh on)"
      }
      tick()
      setInterval(tick, 3000)
    </script>
  </body>
</html>
