  <h1>SMT — client updates</h1>
  <p>ImagineUpdate file payloads are served from <code>/files/</code> (overlay first,
    then base). A minimal empty overlay is seeded on install so
    <code>hashlist.ver</code> is available immediately.</p>

    publish new files to players.</p>
