<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COE Shader Test</title>
<style>html,body{margin:0;background:#2a2c38}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Compiles every COE material variant on a skinned and a rigid mesh and draws them in a grid.
// Sanity check for the GLSL without converted assets: window.renderDone / window.renderError.
import * as THREE from 'three';
import { createCoeUniforms, setCoeLights, makeCoeMaterial } from '../shaders/coeMaterials.js';
import { DEFAULT_RIG, createRenderer } from './buildScene.js';
try {
  const renderer = createRenderer({ canvas: document.getElementById('c'), width: 576, height: 384 });
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-150, 150, 100, -100, -1000, 1000);
  camera.position.set(0, 0, 500);
  const u = createCoeUniforms();
  setCoeLights(u, { ...DEFAULT_RIG, lights: DEFAULT_RIG.lights.map(l => l.type === 'point' ? { ...l, position: [l.position[0], l.position[1] - 90, l.position[2]] } : l) }, new THREE.Vector3());
  const data = new Uint8Array(16 * 16 * 4);
  for (let i = 0; i < 256; i++) { const c = ((i >> 4) ^ i) & 1 ? 230 : 120; data.set([c, c * 0.8, c * 0.6, 255], i * 4); }
  const tex = new THREE.DataTexture(data, 16, 16); tex.needsUpdate = true;
  const variants = [
    { shader: 'COE_HairColor', colorSlot: 'hair' }, { shader: 'COE_Skinning' },
    { shader: 'COE_SkinningDX', technique: 0 }, { shader: 'COE_SkinningDX', technique: 3 },
    { shader: 'COE_Blender', technique: 0 }, { shader: 'COE_Blender', technique: 13 },
    { shader: 'COE_BlenderS', technique: 4 }, { shader: 'COE_Effecter', technique: 1 }, {},
  ];
  let i = 0;
  for (const skinned of [false, true]) {
    for (const ex of variants) {
      const g = new THREE.SphereGeometry(12, 24, 16);
      g.setAttribute('coeUvA', g.getAttribute('uv'));
      g.setAttribute('coeUvB', g.getAttribute('uv'));
      g.setAttribute('coeUvC', g.getAttribute('uv'));
      const x = -128 + (i % 9) * 32, y = skinned ? -40 : 40;
      const m = makeCoeMaterial({ extras: { diffuse: [1, 1, 1], ambient: [1, 1, 1], specular: [0.3, 0.3, 0.3], glossiness: 20, ...ex },
        maps: { A: tex, B: tex, C: tex }, shared: u, color1: [0.4, 0.1, 0.05, 1] });
      let mesh;
      if (skinned) {
        const n = g.getAttribute('position').count;
        g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(new Uint16Array(n * 4), 4));
        const w = new Float32Array(n * 4); for (let k = 0; k < n; k++) w[k * 4] = 1;
        g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(w, 4));
        const bone = new THREE.Bone(); bone.position.set(x, y, 0); scene.add(bone);
        mesh = new THREE.SkinnedMesh(g, m);
        mesh.bind(new THREE.Skeleton([bone], [new THREE.Matrix4()]), new THREE.Matrix4());
        mesh.bindMode = THREE.DetachedBindMode;
        mesh.position.set(999, 999, 0);   // must be ignored: skinning yields world space
      } else {
        mesh = new THREE.Mesh(g, m); mesh.position.set(x, y, 0);
      }
      mesh.frustumCulled = false;
      scene.add(mesh); i++;
    }
  }
  await renderer.compileAsync(scene, camera);
  renderer.render(scene, camera);
  requestAnimationFrame(() => { window.renderDone = true; });
} catch (e) { console.error(e); window.renderError = String(e); }
</script>
</body>
</html>
